[workspace]
exclude = ["testing/contracts"]

[package]
name = "cw-ica-controller"
version = "0.20.0"
authors = ["srdtrk <srdtrk@hotmail.com>"]
edition = "2021"
description = "This is a CosmWasm implementation of an ICS-27 interchain accounts controller."
repository = "https://github.com/srdtrk/cw-ica-controller"
license = "MIT OR Apache-2.0"
readme = "README.md"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[profile.release]
opt-level = 3
debug = false
rpath = false
lto = true
debug-assertions = false
codegen-units = 1
panic = 'abort'
incremental = false
overflow-checks = true

[features]
# disable export feature to disable all instantiate/execute/query exports
default = ["export", "staking", "query"]
export = ["query", "staking"]
staking = ["cosmwasm-std/staking"]
query = ["dep:prost"]

[package.metadata.scripts]
optimize = """docker run --rm -v "$(pwd)":/code \
  --mount type=volume,source="$(basename "$(pwd)")_cache",target=/code/target \
  --mount type=volume,source=registry_cache,target=/usr/local/cargo/registry \
  cosmwasm/optimizer:0.16.0
"""

[dependencies]
cosmwasm-schema = { path = "../ZK/cw/zk-cosmwasm/packages/schema" }
cosmwasm-std = { path = "../ZK/cw/zk-cosmwasm/packages/std", features = ["cosmwasm_3_0", "stargate"] }
cw-storage-plus = { path = "../ZK/cw/zk-storage-plus" }
cw2 = { path = "../ZK/cw/zk-cw-minus/packages/cw2" }
schemars = "0.8"
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde-json-wasm = "1.0"
thiserror = "1.0"
cosmos-sdk-proto = { path = "../cosmos-rust/cosmos-sdk-proto", features = ["cosmwasm"] }
ibc-proto = { path = "../ibc-proto-rs" }
semver = "1.0"
cw-ownable = { path = "../ZK/cw/zk-plus-plus/packages/ownable" }
cw-ica-controller-derive = "0.4.2"
prost = { version = "0.14", optional = true }
anybuf = "0.5"
serde_with = "3.8"

[dev-dependencies]
base64 = "0.13.1"
