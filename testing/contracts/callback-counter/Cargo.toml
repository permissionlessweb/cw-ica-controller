[package]
name = "callback-counter"
version = "0.1.0"
authors = ["srdtrk <srdtrk@hotmail.com>"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = 3
debug = false
rpath = false
lto = true
debug-assertions = false
codegen-units = 1
panic = 'abort'
incremental = false
overflow-checks = true

[features]
# use library feature to disable all instantiate/execute/query exports
library = []

[dependencies]
cosmwasm-schema = { path = "../../../../ZK/cw/zk-cosmwasm/packages/schema" }
cosmwasm-std = { path = "../../../../ZK/cw/zk-cosmwasm/packages/std", features = ["cosmwasm_1_4"] }
cw-storage-plus = { path = "../../../../ZK/cw/zk-storage-plus" }
cw2 = { path = "../../../../ZK/cw/zk-cw-minus/packages/cw2" }
cw-ica-controller = { path = "../../..", default-features = false, features = ["query", "staking"] }
schemars = "0.8"
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde-json-wasm = "1.0"
thiserror = "1.0"
